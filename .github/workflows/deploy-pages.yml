name: Deploy web demo to GitHub Pages

# Démo web jouable sur https://gonzaguebt.github.io/GQuizz/
# (le repo doit être public, ou le compte sur un plan payant).
# Les achats tournent en stub (EXPO_PUBLIC_PURCHASES_STUB=1).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Export web (SPA, base /GQuizz)
        run: npm run export:web
        env:
          EXPO_WEB_BASE_URL: /GQuizz
          EXPO_PUBLIC_PURCHASES_STUB: '1'

      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
